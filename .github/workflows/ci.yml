name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to full commit SHAs; Dependabot keeps them current.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres: ['16', '17', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          # Throwaway credentials for the disposable CI service container only.
          POSTGRES_USER: ddl_mt
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ddl_mt -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
        env:
          DDL_MT_TEST_DSN: host=localhost port=5432 user=ddl_mt password=test-only dbname=postgres sslmode=disable
      - run: make build
      - run: bin/ddl-mt --project examples/shop/ddl-mt.json --target development validate

  pgbouncer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y postgresql pgbouncer
      - run: make test-pgbouncer

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Scan with the newest Go release, which is also used for release binaries.
          go-version: stable
          check-latest: true
          cache: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
